# This file contains the cava settings for the dynamic island visualiser

# Section: General
[general]
bars = 12
framerate = 60

# Section: Output
# Numbers 0-100 separated by ";", one frame per line, read by shell.qml
[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
